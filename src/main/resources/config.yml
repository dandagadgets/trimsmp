# TrimSMP configuration
# A player's power activates only when all 4 armor pieces (helmet, chestplate,
# leggings, boots) carry the SAME trim pattern. The trim MATERIAL of the
# weakest piece in the set decides the power's tier (1-5, see tiers below).
#
# Tiers: 1=Common (iron/copper/quartz)  2=Uncommon (gold/redstone/lapis)
#        3=Rare (amethyst/emerald)      4=Epic (diamond)   5=Legendary (netherite)
#
# Every trim has a PASSIVE (always on while the set is worn) and an ACTIVE power,
# triggered by sneaking + swapping hands (default F key), on a per-pattern cooldown
# that shortens at higher tiers. Silence, Vex, Wild and Raiser/Ward also have extra
# mechanics that trigger automatically (a "disrupt") when you're badly hurt.
#
# Most numeric values below scale with tier automatically inside the code
# (base + tier * per-tier); the numbers here are the tunable base/step inputs.

general:
  # Seconds between passive ability ticks (potion effects, auras, scans).
  tick-interval-seconds: 1
  # Broadcast an action-bar hint the first time a player completes a matching set.
  announce-activation: true
  activation-message: '&d&lTRIM SET ACTIVE &7- &f%pattern% &7(tier %tier%)'

